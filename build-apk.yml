name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Generate sources
        run: |
          set -e
          mkdir -p app
          printf '%s' '' | base64 -d > app/build.gradle
          mkdir -p app/src/main
          printf '%s' '' | base64 -d > app/src/main/AndroidManifest.xml
          mkdir -p app/src/main/java/com/android/systemui/xf
          printf '%s' '' | base64 -d > app/src/main/java/com/android/systemui/xf/MainActivity.java
          mkdir -p app/src/main/java/com/android/systemui/xf
          printf '%s' '' | base64 -d > app/src/main/java/com/android/systemui/xf/EspService.java
          mkdir -p app/src/main/java/com/android/systemui/xf
          printf '%s' '' | base64 -d > app/src/main/java/com/android/systemui/xf/EspView.java
          printf '%s' 'YnVpbGRzY3JpcHQgewogICAgcmVwb3NpdG9yaWVzIHsgZ29vZ2xlKCk7IG1hdmVuQ2VudHJhbCgpIH0KICAgIGRlcGVuZGVuY2llcyB7IGNsYXNzcGF0aCAnY29tLmFuZHJvaWQudG9vbHMuYnVpbGQ6Z3JhZGxlOjguMS40JyB9Cn0KYWxscHJvamVjdHMgewogICAgcmVwb3NpdG9yaWVzIHsgZ29vZ2xlKCk7IG1hdmVuQ2VudHJhbCgpIH0KfQo=' | base64 -d > build.gradle
          printf '%s' 'cm9vdFByb2plY3QubmFtZSA9ICJYRk92ZXJsYXkiCmluY2x1ZGUgJzphcHAnCg==' | base64 -d > settings.gradle
          printf '%s' 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==' | base64 -d > gradle.properties

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XF-Overlay-System
          path: app/build/outputs/apk/debug/*.apk
